<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            border-collapse: collapse;
            margin: auto;
        }

        td {
            border: 3px solid black;
            width: 100px;
            height: 100px;
            text-align: center;
            font-size: 40px;
        }

        .bomba,
        .feliz {
            color: transparent;
        }

        .bomba:hover {
            color: black;
            background-color: gray;
        }

        .feliz:hover {
            color: black;
            background-color: yellow;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
            <td class="bomba">&#128163;</td>
            <td class="feliz">&#128526;</td>
        </tr>

        <tr>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
        </tr>

        <tr>
            <td class="feliz">&#128526;</td>
            <td class="bomba">&#128163;</td>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
        </tr>

        <tr>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
            <td class="feliz">&#128526;</td>
        </tr>
    </table>

</body>
</html>
