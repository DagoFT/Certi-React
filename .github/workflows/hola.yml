name: Hola Mundo

on:
  push:
  workflow_dispatch:

jobs:
  hola:
    runs-on: ubuntu-latest

    steps:
      - name: Saludar
        run: echo "Hello World!"

      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: En que carpeta estoy
        run: pwd

      - name: Listado de archivos
        run: ls -la

      - name: Instalar code
        uses: actions/setup-node@v4

      - name: Verificar node
        run: node --version

      - name: Verificar npm
        run: npm --version

      - name: Install ci
        run: npm ci

      - name: Check TypeScript
        run: npx tsc -p tsconfig.json --noEmit

      - name: Guardar resultado
        run: npx vite build

      - name: Configurar Github Pages
        run: actions/configure-pages@v5

      - name: Subir resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publicar aplicación
        uses: actions/deploy-pages@v4