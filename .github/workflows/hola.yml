name: Publicar SerpientePorTurnos

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  serpiente:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: En que carpeta estoy
        run: pwd

      - name: Listado de archivos
        run: ls -la

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar node
        run: node --version

      - name: Verificar npm
        run: npm --version

      - name: Instalar dependencias
        working-directory: ./SerpientePorTurnos
        run: npm ci

      - name: Crear build
        working-directory: ./SerpientePorTurnos
        run: npm run build

      - name: Configurar Github Pages
        uses: actions/configure-pages@v5

      - name: Subir resultado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./SerpientePorTurnos/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4