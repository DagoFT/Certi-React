name: Publicar Neon Salvage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar Node
        run: node --version

      - name: Verificar npm
        run: npm --version

      - name: Instalar dependencias del frontend
        working-directory: ./Proyecto final/frontend
        run: npm ci

      - name: Crear build del frontend
        working-directory: ./Proyecto final/frontend
        run: npm run build

      - name: Instalar dependencias del backend
        working-directory: ./Proyecto final/backend
        run: npm ci

      - name: Crear build del backend
        working-directory: ./Proyecto final/backend
        run: npm run build

      - name: Verificar archivos generados
        run: |
          echo "Frontend:"
          ls -la "./Proyecto final/frontend/dist"
          echo "Backend:"
          ls -la "./Proyecto final/backend/dist"

      - name: Publicar en Render
        if: success()
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"