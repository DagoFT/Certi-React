name: Hola Mundo

on:
  push:
  workflow_dispatch:

jobs:
  hola:
    runs-on: ubuntu-latest

    steps:
      - name: Saludar
        run: echo "Hello World!"
      - name: Descargar Codigo
        uses: actions/checkout@v4
      - name: En que carpeta estoy
        run: pwd
      - name: Listado de archivos
        run: ls -la
      - name: Instalar code
        uses: actions/setup-node@v4
      - name: Verificar node
        run: node --version 
      - name: Verificar npm
        run: npm --version
       