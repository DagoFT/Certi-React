name: Publicar Neon Salvage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar Node
        run: node --version

      - name: Verificar npm
        run: npm --version

      - name: Instalar dependencias del frontend
        working-directory: ./Proyecto Final/frontend
        run: npm ci

      - name: Crear build del frontend
        working-directory: ./Proyecto Final/frontend
        run: npm run build

      - name: Instalar dependencias del backend
        working-directory: ./Proyecto Final/backend
        run: npm ci

      - name: Crear build del backend
        working-directory: ./Proyecto Final/backend
        run: npm run build

      - name: Verificar archivos generados
        run: |
          echo "Frontend:"
          ls -la "./Proyecto Final/frontend/dist"
          echo "Backend:"
          ls -la "./Proyecto Final/backend/dist"

      - name: Publicar en Render
        if: success()
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del frontend
        working-directory: ./Proyecto Final/frontend
        run: npm ci

      - name: Ejecutar lint del frontend
        working-directory: ./Proyecto Final/frontend
        run: npm run lint

      - name: Instalar dependencias del backend
        working-directory: ./Proyecto Final/backend
        run: npm ci

      - name: Ejecutar lint del backend
        working-directory: ./Proyecto Final/backend
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de Playwright
        working-directory: ./Proyecto Final
        run: npm install

      - name: Instalar navegador Chromium
        working-directory: ./Proyecto Final
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: ./Proyecto Final
        run: npm run test:e2e

