<!DOCTYPE html>
<html>
<head>
    <title>Mi página</title>
</head>

<body>

    <section id="root"></section>

    <script type="module">
        import React from "https://esm.sh/react@19.2.8";
        import { createRoot } from "https://esm.sh/react-dom@19.2.8/client";

        console.log(React);
        console.log(createRoot);

        const contenedor = document.querySelector("#root");

        const root = createRoot(contenedor);

        function TresEnRaya() {
            return React.createElement(
                "section",
                { className: "juego" },
                React.createElement("h1", null, "TresEnRaya"),
                React.createElement("p", null, "Hola")
            );
        }

        root.render(React.createElement(TresEnRaya));
    </script>

</body>
</html>
